basic:
  gui: false
dataset:
  name: 20260901_IFS_MBlank
  descr: Generated from 20260901_IFS_MBlank_log.txt
  datapath: /data20/CD6/IFS/sep01/
  outpath: /home/pbenac/diffPTC/results/
  head: IFS
  date: '260901'
  modes:
    - default_fast0_6
    - fast0_6_lpf265392
    - fast0_6_lpf15165
    - fast0_6_lpf7582
    - fast0_6_lpf5055
    - fast0_6_lpf3791
    - default_fast1_0
    - fast1_0_lpf265392
    - fast1_0_lpf15165
    - fast1_0_lpf7582
    - fast1_0_lpf5055
    - fast1_0_lpf3791
    - default_slow
    - lpf_196_slow
    - lpf_273_slow
    - lpf_392_slow
    - lpf_632_slow

roi:
  x_start: 100
  x_end: 700
  y_start: 100
  y_end: 700


dark_roi:
  x_start: 1500
  x_end: 1900
  y_start: 1500
  y_end: 1900

well_depth:
  find_bright_pixels: False
  bright_pixel_fraction: 0.20
  bright_pixel_adc_fraction: 0.75
  bright_pixel_min_pixels: 10
  bright_pixel_late_reads: 3

  reference_read_index: 1
  slope_start_frame: 3
  slope_stop_frame: 100

  deviation_threshold: 0.10
  slope_cutoff: 0.05
  min_signal_fraction: 0.25
  consecutive_points: 2

  include_pre_read_signal: true
  pre_read_frames: 1.0

  roi:
    x_start: 100
    x_end: 700
    y_start: 100
    y_end: 700

pixel_linearity:
  section: illuminated
  reference_read_index: 1
  slope_start_frame: 3
  slope_stop_frame: 6
  # Require the threshold to remain exceeded for this many
  # consecutive native reads.
  consecutive_points: 2
  # Avoid triggering on noisy near-zero signal.
  min_signal_fraction: 0.10
  # Number of individual pixel traces in diagnostic plot.
  diagnostic_pixels: 10
  include_pre_read_signal: true
  pre_read_frames: 1.0
  hist_bins: 40

