basic:
  gui: false
dataset:
  name: 20260901_IMG_Illuminated_EveningTests
  descr: Generated from 20260901_IMG_Illuminated_EveningTests_log.txt
  datapath: /data20/CD6/IMG/sep01/
  outpath: /home/pbenac/diffPTC/results/
  head: IMG
  date: '260901'
  modes:
    - default_fast1_0
