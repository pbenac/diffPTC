roi:
  x_start: 900
  x_end: 1200
  y_start: 900
  y_end: 1200
dark_roi:
  x_start: 1600
  x_end: 1900
  y_start: 300
  y_end: 600
analysis:
  first_read: 2
  last_read: 30
well_depth:
  find_bright_pixels: True
  bright_pixel_fraction: 0.20
  bright_pixel_adc_fraction: 0.75
  bright_pixel_min_pixels: 10
  bright_pixel_late_reads: 3

  reference_read_index: 1
  slope_start_frame: 3
  slope_stop_frame: 100

  deviation_threshold: 0.05
  slope_cutoff: 0.05
  min_signal_fraction: 0.25
  consecutive_points: 2

  include_pre_read_signal: true
  pre_read_frames: 1.0

pixel_linearity:
  section: illuminated
  reference_read_index: 1
  slope_start_frame: 3
  slope_stop_frame: 6
  # Require the threshold to remain exceeded for this many
  # consecutive native reads.
  consecutive_points: 2
  # Avoid triggering on noisy near-zero signal.
  min_signal_fraction: 0.10
  # Number of individual pixel traces in diagnostic plot.
  diagnostic_pixels: 10
  include_pre_read_signal: true
  pre_read_frames: 1.0
  hist_bins: 40

